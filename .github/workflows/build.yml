name: Build custom APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Скачать исходники игры
        run: curl -sL https://codeload.github.com/narezy/tilcayo/tar.gz/refs/heads/main | tar xz --strip-components=1

      - name: Наложить своего персонажа
        run: |
          rm -f app/src/main/res/drawable-nodpi/tilcayo.png
          tar xzf custom.tar.gz

      - uses: gradle/actions/setup-gradle@v4

      - name: Собрать APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: tilcayo-custom-apk
          path: app/build/outputs/apk/debug/app-debug.apk
